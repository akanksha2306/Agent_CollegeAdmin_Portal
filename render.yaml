# Render Blueprint — one free Docker web service serving the AMP app (frontend + API).
# Database stays on Neon (set DATABASE_URL in the dashboard).
services:
  - type: web
    name: amp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: DATABASE_URL
        sync: false # set this yourself in the dashboard (your Neon connection string)
